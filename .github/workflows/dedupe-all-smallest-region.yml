# Eén run: alle dubbele slugs → behoud kopie in kleinste dataset (min. klimmen in JSON-bestand).
name: Dedupe all (keep smallest dataset)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dedupe-all-smallest-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep smallest dataset per duplicate slug
        run: |
          python scripts/dedupe_keep_smallest_region.py
          python scripts/rebuild_climb_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/climbs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data(climbs): dedupe all duplicates (keep smallest dataset)"
          bash scripts/ci_push_main.sh main
