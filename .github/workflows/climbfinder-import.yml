# Run Climbfinder import server-side (unified: subregio’s via plan_locality_import.py).
# Trigger: GitHub → Actions → Climbfinder import → Run workflow
# Or: site import page → "Start serverimport" (Firebase Function) / gh workflow run …

name: Climbfinder import

on:
  workflow_dispatch:
    inputs:
      locality:
        description: "Climbfinder locality id (l=). Land/macro → subregio-batch; anders één regio."
        required: true
        type: string
      pages:
        description: "Ranking pages voor enkele subregio (25 each), of all. Batch negeert dit (altijd all)."
        required: false
        default: "2"
        type: string
      meta_id:
        description: "JSON meta.id (alleen enkele subregio; batch gebruikt per-regio id’s)"
        required: true
        type: string
      title:
        description: "Dataset title"
        required: true
        type: string
      country:
        description: "ISO country code (NL, FR, …)"
        required: true
        type: string
      region_label:
        description: "Region label stored on each climb (enkele subregio)"
        required: true
        type: string
      locality_label:
        description: "Label for locality id in JSON meta (default: dataset title)"
        required: false
        default: ""
        type: string
      limit:
        description: "Max climbs (enkele subregio). Batch: per-regio limit uit plan."
        required: false
        default: "50"
        type: string
      publish_to_site:
        description: "Commit JSON to docs/climbs/data + update index (GitHub Pages)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      merge_into:
        description: "Optional: append climbs to data/{name}.json (alleen enkele subregio)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: climbfinder-import-${{ github.repository }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Runner check
        run: echo "Job started on $(uname -a)"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-climbimport.txt

      - name: Build import plan (subregio’s)
        id: plan
        run: |
          set -euo pipefail
          python scripts/plan_locality_import.py \
            --locality "${{ inputs.locality }}" \
            --country-iso "${{ inputs.country }}" \
            --meta-id "${{ inputs.meta_id }}" \
            --title "${{ inputs.title }}" \
            --region-label "${{ inputs.region_label }}" \
            --limit "${{ inputs.limit }}" \
            --pages "${{ inputs.pages }}" \
            > /tmp/import-plan.tsv
          COUNT=$(grep -c . /tmp/import-plan.tsv || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Import plan (${COUNT} regio(s)):"
          cat /tmp/import-plan.tsv

      - name: Run import plan
        run: |
          chmod +x scripts/run_climbfinder_import_plan.sh
          bash scripts/run_climbfinder_import_plan.sh \
            /tmp/import-plan.tsv \
            "${{ inputs.publish_to_site }}" \
            "${{ inputs.merge_into }}"

      - name: Commit and push dataset
        if: inputs.publish_to_site == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/climbs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data(climbs): import l=${{ inputs.locality }} (${{ inputs.region_label }}, ${{ steps.plan.outputs.count }} regio(s))"
          bash scripts/ci_push_main.sh main

      - name: Upload JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climbfinder-import-${{ inputs.locality }}-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: warn
