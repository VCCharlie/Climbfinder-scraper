# Run Climbfinder import server-side (same as scripts/climbfinder_import.py).
# Trigger: GitHub → Actions → Climbfinder import → Run workflow
# Or: site import page → "Start serverimport" (Firebase Function) / gh workflow run …

name: Climbfinder import

on:
  workflow_dispatch:
    inputs:
      locality:
        description: "Climbfinder locality id (l=), e.g. 277 for South Holland"
        required: true
        type: string
      pages:
        description: "Ranking pages (25 each), or all for complete Popular list (e.g. l=27 ≈688)"
        required: false
        default: "2"
        type: string
      meta_id:
        description: "JSON meta.id / filename stem"
        required: true
        type: string
      title:
        description: "Dataset title"
        required: true
        type: string
      country:
        description: "ISO country code (NL, FR, …)"
        required: true
        type: string
      region_label:
        description: "Region label stored on each climb"
        required: true
        type: string
      limit:
        description: "Max climbs to import (use 700+ with pages=all for full South Limburg)"
        required: false
        default: "50"
        type: string
      publish_to_site:
        description: "Commit JSON to docs/climbs/data + update index (GitHub Pages)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      merge_into:
        description: "Optional: append climbs to data/{name}.json (e.g. nl-popular for combined NL)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-climbimport.txt

      - name: Run climbfinder_import.py
        run: |
          mkdir -p out
          LIMIT_ARGS=()
          if [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARGS=(--limit "${{ inputs.limit }}")
          fi
          PAGE_ARGS=()
          if [ "${{ inputs.pages }}" = "all" ] || [ "${{ inputs.pages }}" = "0" ]; then
            PAGE_ARGS=(--all-pages)
          else
            PAGE_ARGS=(--pages "${{ inputs.pages }}")
          fi
          python scripts/climbfinder_import.py \
            --locality "${{ inputs.locality }}" \
            "${PAGE_ARGS[@]}" \
            --meta-id "${{ inputs.meta_id }}" \
            --title "${{ inputs.title }}" \
            --country "${{ inputs.country }}" \
            --region-label "${{ inputs.region_label }}" \
            --out "out/${{ inputs.meta_id }}.json" \
            "${LIMIT_ARGS[@]}"

      - name: Publish to docs/climbs (map + Pages)
        if: inputs.publish_to_site == 'true'
        run: |
          MERGE_ARGS=()
          if [ -n "${{ inputs.merge_into }}" ]; then
            MERGE_ARGS=(--merge-into "${{ inputs.merge_into }}")
          fi
          python scripts/publish_climb_json.py \
            --bundle "out/${{ inputs.meta_id }}.json" \
            "${MERGE_ARGS[@]}"
          python scripts/rebuild_climb_index.py

      - name: Commit and push dataset
        if: inputs.publish_to_site == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/climbs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data(climbs): import ${{ inputs.meta_id }} (${{ inputs.region_label }})"
          git push

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: climbfinder-${{ inputs.meta_id }}
          path: out/${{ inputs.meta_id }}.json
          if-no-files-found: error
