# Alias: zelfde unified import als climbfinder-import.yml (macro = locality in plan).
name: Macro klimgebied import batch

on:
  workflow_dispatch:
    inputs:
      macro_locality_id:
        description: "Macro group locality id (zelfde als Klimgebieden / climbfinder-import)"
        required: true
        type: string
      country_iso:
        description: "Country ISO if macro id is ambiguous (usually FR, NL, …)"
        required: false
        default: ""
        type: string
      skip_dedupe:
        description: "Deprecated (dedupe always after multi-region). Kept for compatibility."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: climbfinder-import-${{ github.repository }}
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-climbimport.txt

      - name: Build import plan
        id: plan
        run: |
          set -euo pipefail
          ISO="${{ inputs.country_iso }}"
          EXTRA=()
          if [ -n "$ISO" ]; then EXTRA=(--country-iso "$ISO"); fi
          python scripts/plan_locality_import.py \
            --locality "${{ inputs.macro_locality_id }}" \
            "${EXTRA[@]}" \
            --meta-id "cf-l${{ inputs.macro_locality_id }}-batch" \
            --title "macro-${{ inputs.macro_locality_id }}" \
            --region-label "macro" \
            > /tmp/import-plan.tsv
          COUNT=$(grep -c . /tmp/import-plan.tsv || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          cat /tmp/import-plan.tsv

      - name: Run import plan
        if: steps.plan.outputs.count != '0'
        run: |
          chmod +x scripts/run_climbfinder_import_plan.sh
          bash scripts/run_climbfinder_import_plan.sh /tmp/import-plan.tsv true ""

      - name: Commit and push
        if: steps.plan.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/climbs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data(climbs): macro l=${{ inputs.macro_locality_id }} batch import (${{ steps.plan.outputs.count }} regio(s))"
          bash scripts/ci_push_main.sh main
