# Regenerate data/index.json when climb datasets change (upload JSON only — no hand-edited index).

name: Rebuild climb index

on:
  push:
    branches: [main]
    paths:
      - "docs/climbs/data/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-climb-index-${{ github.repository }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index.json from datasets
        run: python scripts/rebuild_climb_index.py

      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/climbs/data/index.json
          if git diff --staged --quiet; then
            echo "index.json already up to date"
            exit 0
          fi
          git commit -m "chore(climbs): rebuild data/index.json from datasets [skip ci]"
          git push
