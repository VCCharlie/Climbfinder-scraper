# One-time / occasional: deploy import-page callables (import, dedupe, backfill).
# Repo secrets (Settings → Secrets → Actions):
#   FIREBASE_SERVICE_ACCOUNT — JSON key for a GCP service account used only for deploy
#   CLIMBFINDER_IMPORT_PAT — fine-grained PAT with Actions: Read and write on this repo
#   (GitHub forbids secret names starting with GITHUB_)
#
# IAM (project climbfinder-scraper): deploy SA needs Firebase Admin (or Functions Admin + Build)
# AND Service Account User on climbfinder-scraper@appspot.gserviceaccount.com — see docs/auth/GITHUB_IMPORT.md
name: Deploy Climbfinder import function

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Enable required Google APIs
        run: |
          gcloud services enable \
            firebaseextensions.googleapis.com \
            cloudfunctions.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            compute.googleapis.com \
            appengine.googleapis.com \
            --project climbfinder-scraper
        continue-on-error: true

      - name: Preflight (App Engine — vereist voor 1st Gen Functions)
        run: |
          if ! gcloud app describe --project climbfinder-scraper >/dev/null 2>&1; then
            echo "::warning::Geen App Engine-app in dit project. 1st Gen Cloud Functions falen vaak zonder App Engine."
            echo "Owner: https://console.cloud.google.com/appengine/start?project=climbfinder-scraper"
            echo "Kies regio europe-west (past bij functions europe-west1), daarna workflow opnieuw."
          else
            gcloud app describe --project climbfinder-scraper --format='value(locationId,servingStatus)'
          fi

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Set Functions config (GitHub PAT)
        env:
          CLIMBFINDER_IMPORT_PAT: ${{ secrets.CLIMBFINDER_IMPORT_PAT }}
        run: |
          if [ -z "$CLIMBFINDER_IMPORT_PAT" ]; then
            echo "::error::Secret CLIMBFINDER_IMPORT_PAT ontbreekt."
            exit 1
          fi
          firebase functions:config:set \
            github.pat="$CLIMBFINDER_IMPORT_PAT" \
            github.repo="VCCharlie/Climbfinder-scraper" \
            github.ref="main" \
            --project climbfinder-scraper

      - name: Set Strava config (optional secrets)
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: |
          if [ -z "$STRAVA_CLIENT_ID" ] || [ -z "$STRAVA_CLIENT_SECRET" ]; then
            echo "Strava secrets niet gezet — skip (voeg STRAVA_CLIENT_ID + STRAVA_CLIENT_SECRET toe voor Koppel Strava)."
            exit 0
          fi
          firebase functions:config:set \
            strava.client_id="$STRAVA_CLIENT_ID" \
            strava.client_secret="$STRAVA_CLIENT_SECRET" \
            strava.redirect_uri="https://europe-west1-climbfinder-scraper.cloudfunctions.net/stravaOAuthCallback" \
            strava.site_return_url="https://vccharlie.github.io/Climbfinder-scraper/climbs/settings.html" \
            --project climbfinder-scraper

      - name: Deploy import callables
        run: |
          set -o pipefail
          firebase deploy --only \
            functions:requestClimbfinderImport,functions:requestClimbDuplicateRemovals,functions:requestClimbDedupeAllSmallest,functions:requestClimbRegionBackfill,functions:requestClimbMacroBatchImport,functions:getStravaConnectUrl,functions:stravaOAuthCallback,functions:stravaDisconnect,functions:getStravaStatus,functions:stravaSyncTrial \
            --project climbfinder-scraper --non-interactive --debug 2>&1 | tee firebase-deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}
          if grep -q "0 Functions Errored" firebase-deploy.log && grep -q "Deploy complete!" firebase-deploy.log; then
            if [ "$DEPLOY_EXIT" -ne 0 ]; then
              echo "::warning::Functions staan live; Firebase exit ${DEPLOY_EXIT} door cleanup (Artifact Registry delete 403 is normaal zonder extra IAM-rol)."
              echo "Geef deploy-SA rol Artifact Registry Administrator als je cleanup-warnings wilt vermijden — zie docs/auth/GITHUB_IMPORT.md"
            fi
            exit 0
          fi
          exit "$DEPLOY_EXIT"

      - name: Upload deploy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-deploy-log
          path: firebase-deploy.log
