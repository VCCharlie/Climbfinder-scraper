# One-time / occasional: deploy requestClimbfinderImport so import.html one-click works.
# Repo secrets (Settings → Secrets → Actions):
#   FIREBASE_SERVICE_ACCOUNT — JSON key for a GCP service account used only for deploy
#   CLIMBFINDER_IMPORT_PAT — fine-grained PAT with Actions: Read and write on this repo
#   (GitHub forbids secret names starting with GITHUB_)
#
# IAM (project climbfinder-scraper): deploy SA needs Firebase Admin (or Functions Admin + Build)
# AND Service Account User on climbfinder-scraper@appspot.gserviceaccount.com — see docs/auth/GITHUB_IMPORT.md
name: Deploy Climbfinder import function

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Set Functions config (GitHub PAT)
        env:
          CLIMBFINDER_IMPORT_PAT: ${{ secrets.CLIMBFINDER_IMPORT_PAT }}
        run: |
          if [ -z "$CLIMBFINDER_IMPORT_PAT" ]; then
            echo "::error::Secret CLIMBFINDER_IMPORT_PAT ontbreekt."
            exit 1
          fi
          firebase functions:config:set \
            github.pat="$CLIMBFINDER_IMPORT_PAT" \
            github.repo="VCCharlie/Climbfinder-scraper" \
            github.ref="main" \
            --project climbfinder-scraper

      - name: Deploy requestClimbfinderImport
        run: firebase deploy --only functions:requestClimbfinderImport --project climbfinder-scraper --non-interactive
