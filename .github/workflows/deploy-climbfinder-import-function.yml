# One-time / occasional: deploy import-page callables (import, dedupe, backfill).
# Repo secrets (Settings → Secrets → Actions):
#   FIREBASE_SERVICE_ACCOUNT — JSON key for github-deploy-functions@… (climb-database)
#   CLIMBFINDER_IMPORT_PAT — fine-grained PAT with Actions: Read and write on this repo
#   (GitHub forbids secret names starting with GITHUB_)
#
# Optional: FIREBASE_PROJECT_ID — defaults to climb-database (see env below)
#
# IAM: deploy SA needs Firebase Admin + Service Account User on @appspot + compute SA
# + Artifact Registry Writer on project (gcf-artifacts in europe-west1)
# See docs/auth/GITHUB_IMPORT.md and docs/auth/MIGRATE_FIREBASE.md
name: Deploy Climbfinder import function

on:
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: climb-database

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Enable required Google APIs
        run: |
          gcloud services enable \
            firebaseextensions.googleapis.com \
            runtimeconfig.googleapis.com \
            cloudfunctions.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            cloudtasks.googleapis.com \
            compute.googleapis.com \
            appengine.googleapis.com \
            --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        continue-on-error: true

      - name: Enable Cloud Tasks API (Strava server-sync)
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        run: |
          gcloud services enable cloudtasks.googleapis.com --project "$FIREBASE_PROJECT_ID" || \
            echo "::warning::Deploy-SA kon Cloud Tasks API niet inschakelen — owner: console API Enable, daarna workflow opnieuw."
        continue-on-error: true

      - name: Ensure Strava Cloud Tasks queue
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        run: |
          # Niet blokkeren: deploy-SA heeft vaak geen cloudtasks.queues.create (owner maakt queue eenmalig).
          REGION=europe-west1
          QUEUE=strava-sync
          if gcloud tasks queues describe "$QUEUE" --location="$REGION" --project="$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
            echo "Cloud Tasks queue ${QUEUE} OK (${REGION})"
            exit 0
          fi
          if gcloud tasks queues create "$QUEUE" \
            --location="$REGION" \
            --project="$FIREBASE_PROJECT_ID" \
            --max-dispatches-per-second=2 \
            --max-concurrent-dispatches=1 \
            --max-attempts=8 \
            --min-backoff=45s \
            --max-backoff=600s; then
            echo "Cloud Tasks queue ${QUEUE} aangemaakt"
            exit 0
          fi
          echo "::warning::Queue ${QUEUE} ontbreekt en kon niet worden aangemaakt (PERMISSION_DENIED cloudtasks.queues.create op github-deploy-functions@…)."
          echo "::warning::Functions-deploy gaat door. Strava server-sync (beta) werkt pas na queue + Enqueuer op @appspot — zie docs/auth/GITHUB_IMPORT.md"
          echo "Owner Cloud Shell:"
          echo "  gcloud tasks queues create ${QUEUE} --location=${REGION} --project=${FIREBASE_PROJECT_ID} \\"
          echo "    --max-dispatches-per-second=2 --max-concurrent-dispatches=1 --max-attempts=8 --min-backoff=45s --max-backoff=600s"

      - name: Ensure gcf-artifacts (Artifact Registry)
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        run: |
          REGION=europe-west1
          REPO=gcf-artifacts
          if gcloud artifacts repositories describe "$REPO" \
            --location="$REGION" \
            --project="$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
            echo "Artifact Registry repository ${REPO} OK (${REGION})"
          else
            echo "Creating ${REPO} in ${REGION} (vereist voor Cloud Functions deploy)…"
            gcloud artifacts repositories create "$REPO" \
              --repository-format=docker \
              --location="$REGION" \
              --project="$FIREBASE_PROJECT_ID" \
              --description="Cloud Functions build artifacts (Firebase)"
          fi

      - name: Preflight (App Engine — vereist voor 1st Gen Functions)
        run: |
          if ! gcloud app describe --project "$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
            echo "::warning::Geen App Engine-app in dit project. 1st Gen Cloud Functions falen vaak zonder App Engine."
            echo "Owner: https://console.cloud.google.com/appengine/start?project=$FIREBASE_PROJECT_ID"
            echo "Kies regio europe-west (past bij functions europe-west1), daarna workflow opnieuw."
          else
            gcloud app describe --project "$FIREBASE_PROJECT_ID" --format='value(locationId,servingStatus)'
          fi
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Remove legacy Gen2 stravaSyncWorker (naamconflict met Gen1 HTTP)
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        continue-on-error: true
        run: |
          REGION=europe-west1
          if gcloud functions describe stravaSyncWorker --region="$REGION" --gen2 --project="$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
            echo "Verwijderen oude Gen2 task-queue function stravaSyncWorker…"
            gcloud functions delete stravaSyncWorker --region="$REGION" --gen2 --project="$FIREBASE_PROJECT_ID" --quiet
          else
            echo "Geen Gen2 stravaSyncWorker — OK"
          fi

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Set Functions config (GitHub PAT)
        env:
          CLIMBFINDER_IMPORT_PAT: ${{ secrets.CLIMBFINDER_IMPORT_PAT }}
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$CLIMBFINDER_IMPORT_PAT" ]; then
            echo "::error::Secret CLIMBFINDER_IMPORT_PAT ontbreekt."
            exit 1
          fi
          firebase functions:config:set \
            github.pat="$CLIMBFINDER_IMPORT_PAT" \
            github.repo="VCCharlie/Climbfinder-scraper" \
            github.ref="main" \
            --project "$FIREBASE_PROJECT_ID"

      - name: Set Strava config (optional secrets)
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$STRAVA_CLIENT_ID" ] || [ -z "$STRAVA_CLIENT_SECRET" ]; then
            echo "Strava secrets niet gezet — skip (voeg STRAVA_CLIENT_ID + STRAVA_CLIENT_SECRET toe voor Koppel Strava)."
            exit 0
          fi
          firebase functions:config:set \
            strava.client_id="$STRAVA_CLIENT_ID" \
            strava.client_secret="$STRAVA_CLIENT_SECRET" \
            strava.redirect_uri="https://vccharlie.github.io/Climbfinder-scraper/climbs/strava-callback.html" \
            strava.site_return_url="https://vccharlie.github.io/Climbfinder-scraper/climbs/settings.html" \
            strava.data_base_url="https://vccharlie.github.io/Climbfinder-scraper/climbs/data" \
            --project "$FIREBASE_PROJECT_ID"

      - name: Set Strava worker config (Phase 3 HTTP + Cloud Tasks)
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          STRAVA_WORKER_SECRET: ${{ secrets.STRAVA_WORKER_SECRET }}
        run: |
          REGION=europe-west1
          SECRET="${STRAVA_WORKER_SECRET:-}"
          if [ -z "$SECRET" ]; then
            SECRET=$(openssl rand -hex 24)
            echo "::warning::Secret STRAVA_WORKER_SECRET ontbreekt — gegenereerd voor deze deploy. Voeg een vaste secret toe in GitHub Actions om worker-auth stabiel te houden."
          fi
          WORKER_URL="https://${REGION}-${FIREBASE_PROJECT_ID}.cloudfunctions.net/stravaSyncWorkerHttp"
          firebase functions:config:set \
            strava.worker_secret="$SECRET" \
            strava.worker_url="$WORKER_URL" \
            --project "$FIREBASE_PROJECT_ID"

      - name: Deploy import callables
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        run: |
          set -o pipefail
          firebase deploy --only \
            functions:requestClimbfinderImport,functions:requestClimbDuplicateRemovals,functions:requestClimbDedupeAllSmallest,functions:requestClimbRegionBackfill,functions:requestClimbMacroBatchImport,functions:requestSplitMonolithBundle,functions:requestClimbfinderScoreBackfill,functions:getGithubWorkflowRunStatus,functions:getStravaConnectUrl,functions:setStravaSyncPrefs,functions:stravaCompleteOAuth,functions:stravaOAuthCallback,functions:stravaDisconnect,functions:getStravaStatus,functions:stravaSyncTrial,functions:stravaSyncFull,functions:stravaCleanupLogMatches,functions:stravaEnqueueFullSync,functions:getStravaSyncJob,functions:stravaCancelSyncJob,functions:stravaSyncWorkerHttp,functions:getCplStatus,functions:cplEnqueueFullSync,functions:cplImportLogbookFromCpl,functions:cplLinkClimbOnActivity,functions:getCplSyncJob,functions:cplCancelSyncJob,functions:cplSyncWorkerHttp \
            --project "$FIREBASE_PROJECT_ID" --non-interactive --debug 2>&1 | tee firebase-deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}
          if grep -qE "Failed to (update|create|upsert).*function|Cannot set CPU on the functions" firebase-deploy.log; then
            echo "::error::Function deploy mislukt (niet alleen cleanup). Controleer gcf-artifacts + IAM Artifact Registry Writer — docs/auth/GITHUB_IMPORT.md"
            if grep -q "Unable to retrieve the repository metadata" firebase-deploy.log; then
              echo "::error::Artifact Registry: metadata voor gcf-artifacts niet leesbaar (repo ontbreekt, API uit, of deploy-SA mist Artifact Registry Writer)."
            fi
            exit "${DEPLOY_EXIT:-1}"
          fi
          if grep -q "0 Functions Errored" firebase-deploy.log && grep -q "Deploy complete!" firebase-deploy.log; then
            if [ "$DEPLOY_EXIT" -ne 0 ]; then
              echo "::warning::Functions staan live; Firebase exit ${DEPLOY_EXIT} door cleanup (Artifact Registry delete 403 is normaal zonder extra IAM-rol)."
              echo "Geef deploy-SA rol Artifact Registry Administrator als je cleanup-warnings wilt vermijden — zie docs/auth/GITHUB_IMPORT.md"
            fi
            exit 0
          fi
          exit "$DEPLOY_EXIT"

      - name: Upload deploy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-deploy-log
          path: firebase-deploy.log
