# Herlabel alle klimmen: region (weergave policy B) + display/resolved locality ids.
name: Backfill climb regions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-climb-regions-${{ github.repository }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build slug resolution index
        run: python scripts/build_region_hierarchy.py

      - name: Backfill climb region fields
        run: python scripts/backfill_climb_resolved_regions.py

      - name: Rebuild index
        run: python scripts/rebuild_climb_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/climbs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data(climbs): backfill macro display region labels on climbs"
          bash scripts/ci_push_main.sh main
