<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climbfinder Ranking Aggregator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
    
    <style>
        /* Custom Overrides for DataTables/Tailwind Integration */
        .dataTables_wrapper .dataTables_length select {
            padding-right: 2rem;
            border-radius: 0.25rem;
            border: 1px solid #e2e8f0;
        }
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #e2e8f0;
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            margin-left: 0.5rem;
        }
        table.dataTable tbody tr:hover {
            background-color: #f1f5f9;
        }
        /* Loading Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-blue-600 flex items-center gap-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                Climbfinder Aggregator
            </h1>
            <p class="text-slate-500 mt-2">Scrape rankings, analyze gradients, and export to Excel.</p>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 mb-8">
            <form id="scrapeForm" class="grid grid-cols-1 md:grid-cols-4 gap-6 items-end">
                
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Region Discovery</label>
                    <div class="flex gap-2">
                        <select id="regionSelect" class="w-full border-slate-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="" disabled selected>Select a popular region...</option>
                            {% for name, id in regions.items() %}
                                <option value="{{ id }}">{{ name }} (ID: {{ id }})</option>
                            {% endfor %}
                            <option value="custom">-- Enter Custom ID --</option>
                        </select>
                        <input type="text" id="customRegionId" placeholder="ID" class="hidden w-24 border-slate-300 rounded-md shadow-sm border p-2 text-center" />
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Page Range</label>
                    <div class="flex items-center gap-2">
                        <input type="number" id="startPage" value="1" min="1" class="w-full border-slate-300 rounded-md shadow-sm border p-2" placeholder="Start">
                        <span class="text-slate-400">to</span>
                        <input type="number" id="endPage" value="3" min="1" class="w-full border-slate-300 rounded-md shadow-sm border p-2" placeholder="End">
                    </div>
                </div>

                <div>
                    <button type="submit" id="scrapeBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition-colors flex justify-center items-center gap-2">
                        <span>Fetch Data</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 hidden" id="resultsContainer">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Results <span id="resultCount" class="text-sm font-normal text-slate-500 ml-2"></span></h2>
            </div>
            
            <div class="overflow-x-auto">
                <table id="climbsTable" class="display w-full text-sm text-left">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Climb Name</th>
                            <th>Difficulty</th>
                            <th>Length (km)</th>
                            <th>Elev. Gain (m)</th>
                            <th>Avg Gradient (%)</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

    <script>
        $(document).ready(function() {
            let table = null;

            // Handle Region Dropdown logic
            $('#regionSelect').on('change', function() {
                if ($(this).val() === 'custom') {
                    $('#customRegionId').removeClass('hidden').focus();
                } else {
                    $('#customRegionId').addClass('hidden');
                }
            });

            $('#scrapeForm').on('submit', function(e) {
                e.preventDefault();
                
                // Determine Region ID
                let regionId = $('#regionSelect').val();
                if (regionId === 'custom') {
                    regionId = $('#customRegionId').val();
                }
                
                if (!regionId) {
                    alert("Please select or enter a Region ID.");
                    return;
                }

                const startPage = $('#startPage').val();
                const endPage = $('#endPage').val();
                const btn = $('#scrapeBtn');
                
                // UI Loading State
                btn.prop('disabled', true).html('<div class="loader"></div> Processing...');
                $('#resultsContainer').addClass('hidden');

                // AJAX Request
                $.ajax({
                    url: '/scrape',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        region_id: regionId,
                        start_page: startPage,
                        end_page: endPage
                    }),
                    success: function(response) {
                        renderTable(response.data);
                        $('#resultCount').text(`(${response.count} climbs found)`);
                        $('#resultsContainer').removeClass('hidden');
                    },
                    error: function(err) {
                        alert('Error fetching data. Check console for details.');
                        console.error(err);
                    },
                    complete: function() {
                        btn.prop('disabled', false).html('<span>Fetch Data</span>');
                    }
                });
            });

            function renderTable(data) {
                if (table) {
                    table.destroy();
                }

                table = $('#climbsTable').DataTable({
                    data: data,
                    columns: [
                        { data: 'rank' },
                        { data: 'name', render: function(data, type, row) {
                            return `<span class="font-medium text-blue-600">${data}</span>`;
                        }},
                        { data: 'difficulty_points' },
                        { data: 'length_km' },
                        { data: 'elevation_gain_m' },
                        { data: 'avg_gradient_pct', render: function(data) {
                            // Color coding logic for gradient
                            let colorClass = 'text-green-600';
                            if(data > 8) colorClass = 'text-red-600 font-bold';
                            else if(data > 5) colorClass = 'text-orange-500';
                            return `<span class="${colorClass}">${data}%</span>`;
                        }}
                    ],
                    dom: 'Bfrtip', // Defines where buttons appear
                    buttons: [
                        {
                            extend: 'excelHtml5',
                            text: 'Export to Excel',
                            className: 'bg-green-600 text-white px-4 py-2 rounded mb-4 hover:bg-green-700',
                            title: 'Climbfinder_Export',
                            autoFilter: true // Adds filter headers in Excel
                        },
                        {
                            extend: 'csvHtml5',
                            text: 'Export CSV',
                            className: 'bg-slate-600 text-white px-4 py-2 rounded mb-4 ml-2 hover:bg-slate-700'
                        }
                    ],
                    pageLength: 25,
                    order: [[0, 'asc']] // Default sort by Rank
                });
            }
        });
    </script>
</body>
</html>
