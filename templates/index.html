<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universele FietsKlim Scraper</title>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

    <style>
        /* Jouw originele styling is behouden */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --blue-600: #2563eb; --blue-700: #1d4ed8; --green-600: #16a34a; --green-700: #15803d;
            --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-300: #cbd5e1;
            --slate-400: #94a3b8; --slate-500: #64748b; --slate-700: #334155; --slate-800: #1e293b;
            --slate-900: #0f172a; --radius: 0.5rem;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,.05);
            --shadow: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
        }
        body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background-color: var(--slate-50); color: var(--slate-800); line-height: 1.6; }
        .container { max-width: 82rem; margin: 0 auto; padding: 2rem 1.5rem; }
        .header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
        .header svg { width: 2rem; height: 2rem; color: var(--blue-600); flex-shrink: 0; }
        .header h1 { font-size: 1.875rem; font-weight: 800; color: var(--slate-900); letter-spacing: -0.025em; }
        .header h1 span { color: var(--blue-600); }
        .subtitle { color: var(--slate-500); font-size: 0.95rem; margin-bottom: 2rem; }
        .card { background: #fff; padding: 1.75rem; border-radius: var(--radius); border: 1px solid var(--slate-200); box-shadow: var(--shadow); margin-bottom: 2rem; }
        .card-title { font-size: 1rem; font-weight: 600; color: var(--slate-700); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
        .card-title svg { width: 1.25rem; height: 1.25rem; color: var(--blue-600); }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--slate-700); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.04em; }
        input[type="text"] { width: 100%; padding: 0.75rem; border: 1px solid var(--slate-300); border-radius: 0.375rem; font-size: 0.875rem; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
        input[type="text"]:focus { border-color: var(--blue-600); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border: none; border-radius: 0.375rem; font-size: 0.875rem; font-weight: 700; cursor: pointer; transition: 0.15s; }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-primary { background-color: var(--blue-600); color: #fff; }
        .btn-primary:hover:not(:disabled) { background-color: var(--blue-700); }
        .btn svg { width: 1rem; height: 1rem; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff; border-radius: 50%; width: 1rem; height: 1rem; animation: spin 0.7s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-wrap { display: none; margin-bottom: 1.5rem; }
        .progress-wrap.active { display: block; }
        .progress-label { font-size: 0.8rem; color: var(--slate-500); margin-bottom: 0.35rem; font-weight: 500; }
        .progress-bar-outer { width: 100%; height: 0.5rem; background: var(--slate-200); border-radius: 1rem; overflow: hidden; }
        .progress-bar-inner { height: 100%; background: var(--blue-600); border-radius: 1rem; transition: width 0.3s ease; width: 0%; }
        .status-bar { display: none; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.375rem; font-size: 0.85rem; font-weight: 500; margin-bottom: 1.5rem; }
        .status-bar.info { display: flex; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .status-bar.success { display: flex; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .status-bar.error { display: flex; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .results-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
        .results-header h2 { font-size: 1.125rem; font-weight: 700; color: var(--slate-800); }
        .results-header .count { font-weight: 400; color: var(--slate-500); font-size: 0.875rem; }
        .export-btns { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .google-sheets-btn, .copy-tsv-btn { color: #fff; padding: 0.4rem 0.85rem; border: none; border-radius: 0.375rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: 0.15s; }
        .google-sheets-btn { background: #0f9d58; } .google-sheets-btn:hover { background: #0b8043; }
        .copy-tsv-btn { background: var(--blue-600); } .copy-tsv-btn:hover { background: var(--blue-700); }
        .table-wrap { overflow-x: auto; }
        .hidden { display: none !important; }
        table.dataTable { border-collapse: collapse !important; width: 100% !important; }
        table.dataTable thead th { background: var(--slate-50); border-bottom: 2px solid var(--slate-200) !important; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--slate-500); padding: 0.75rem !important; }
        table.dataTable tbody td { padding: 0.6rem 0.75rem !important; font-size: 0.85rem; border-bottom: 1px solid var(--slate-100) !important; }
        table.dataTable tbody tr:hover { background-color: #f8fafc !important; }
        .dt-buttons { margin-bottom: 1rem !important; }
        .dt-buttons .dt-button { color: #fff !important; padding: 0.45rem 1rem !important; border-radius: 0.375rem !important; border: none !important; cursor: pointer; font-size: 0.8rem !important; font-weight: 600 !important; }
        .dt-buttons .buttons-excel { background-color: var(--green-600) !important; }
        .dt-buttons .buttons-csv { background-color: var(--slate-500) !important; margin-left: 0.5rem !important; }
        .copy-feedback { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--slate-800); color: #fff; padding: 0.6rem 1.25rem; border-radius: 0.5rem; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
        .copy-feedback.show { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
        </svg>
        <h1>HTML Tabel <span>Scraper</span></h1>
    </div>
    <p class="subtitle">Plak een URL (zoals cyclingup.eu of heuvelsfietsen.nl) en haal direct de tabellen op naar Excel.</p>

    <div class="card">
        <div class="card-title">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            Invoer &amp; Scrape Settings
        </div>

        <form id="scrapeForm" autocomplete="off" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label for="urlInput">Webpagina URL</label>
                <input type="text" id="urlInput" value="https://cyclingup.eu/nederlands/zwaarte.php" placeholder="Plak hier de link van de ranglijstpagina...">
            </div>

            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                <input type="checkbox" id="nlFormat" checked style="width: 1rem; height: 1rem; cursor: pointer;">
                <label for="nlFormat" style="margin: 0; text-transform: none; cursor: pointer;">Gebruik NL getalnotatie (komma als decimaal, belangrijk voor sorteren in Excel)</label>
            </div>

            <button type="submit" id="scrapeBtn" class="btn btn-primary" style="width: 200px;">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                Tabel Ophalen
            </button>
        </form>
    </div>

    <div id="progressWrap" class="progress-wrap">
        <div class="progress-label" id="progressLabel">Fetching...</div>
        <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
    </div>
    <div id="statusBar" class="status-bar"></div>

    <div class="card hidden" id="resultsContainer">
        <div class="results-header">
            <h2>Resultaten <span id="resultCount" class="count"></span></h2>
            <div class="export-btns">
                <button id="copyTsvBtn" class="copy-tsv-btn">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    Copy for Sheets
                </button>
                <button id="googleSheetsBtn" class="google-sheets-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/><path d="M7 12h2v5H7zm4-3h2v8h-2zm4-3h2v11h-2z"/>
                    </svg>
                    Google Sheets CSV
                </button>
            </div>
        </div>

        <div class="table-wrap">
            <table id="climbsTable" class="display" style="width:100%">
                </table>
        </div>
    </div>
</div>

<div id="copyFeedback" class="copy-feedback">Copied to clipboard!</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

<script>
$(document).ready(function () {
    let dataTable = null;
    let currentData = [];
    let currentCols = [];

    function showStatus(type, message) { $('#statusBar').attr('class', 'status-bar ' + type).html(message); }
    function hideStatus() { $('#statusBar').attr('class', 'status-bar').html(''); }
    function showProgress(label, pct) { $('#progressWrap').addClass('active'); $('#progressLabel').text(label); $('#progressBar').css('width', pct + '%'); }
    function hideProgress() { $('#progressWrap').removeClass('active'); $('#progressBar').css('width', '0%'); }

    $('#scrapeForm').on('submit', function (e) {
        e.preventDefault();
        var url = $('#urlInput').val().trim();
        var isDutch = $('#nlFormat').is(':checked');

        if (!url) { showStatus('warning', 'Vul aub een URL in.'); return; }

        var $btn = $('#scrapeBtn');
        $btn.prop('disabled', true).html('<span class="spinner"></span> Bezig...');
        $('#resultsContainer').addClass('hidden');
        
        showProgress('Pagina scannen...', 50);
        showStatus('info', 'Tabel wordt geëxtraheerd van website...');

        $.ajax({
            url: '/api/scrape',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ url: url, is_dutch: isDutch }),
            success: function (response) {
                currentData = response.data || [];
                currentCols = response.columns || [];

                showProgress('Voltooid!', 100);
                setTimeout(hideProgress, 600);
                showStatus('success', 'Succesvol <strong>' + response.count + '</strong> rijen opgehaald.');

                if (response.count > 0) {
                    renderTable(currentCols, currentData);
                    $('#resultCount').text('(' + response.count + ' rijen)');
                    $('#resultsContainer').removeClass('hidden');
                }
            },
            error: function (xhr) {
                hideProgress();
                var msg = 'Netwerkfout of server down.';
                if (xhr.responseJSON && xhr.responseJSON.message) msg = xhr.responseJSON.message;
                showStatus('error', 'Fout: ' + msg);
            },
            complete: function () {
                $btn.prop('disabled', false).html('<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Tabel Ophalen');
            }
        });
    });

    function renderTable(columns, data) {
        // Destroy existing table instance and empty HTML completely to allow new dynamic headers
        if (dataTable) {
            dataTable.destroy();
            $('#climbsTable').empty();
        }

        var tableHeaders = columns.map(function(col) { return { title: col, data: col }; });

        dataTable = $('#climbsTable').DataTable({
            data: data,
            columns: tableHeaders,
            dom: 'Bfrtip',
            buttons: [
                { extend: 'excelHtml5', text: '📥 Export Excel', title: 'Fiets_Tabel' },
                { extend: 'csvHtml5', text: '📄 Export CSV' }
            ],
            pageLength: 25,
            lengthMenu: [10, 25, 50, 100],
            language: {
                search: 'Filter:', lengthMenu: 'Toon _MENU_ rijen',
                info: 'Toont _START_ tot _END_ van _TOTAL_ rijen', emptyTable: 'Geen data beschikbaar'
            }
        });
    }

    // Google Sheets CSV generator voor dynamische kolommen
    $('#googleSheetsBtn').on('click', function () {
        if (!currentData.length) return;
        var headers = currentCols;
        var rows = [headers.join(',')];

        currentData.forEach(function (rowObj) {
            var rowData = headers.map(function(col) {
                var val = rowObj[col];
                if (val === null || val === undefined) val = '';
                return '"' + String(val).replace(/"/g, '""') + '"';
            });
            rows.push(rowData.join(','));
        });

        var csv = '\uFEFF' + rows.join('\r\n');
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'FietsTabel_GoogleSheets.csv'; a.click();
        URL.revokeObjectURL(url);
    });

    // Copy TSV voor dynamische kolommen
    $('#copyTsvBtn').on('click', function () {
        if (!currentData.length) return;
        var headers = currentCols;
        var rows = [headers.join('\t')];

        currentData.forEach(function (rowObj) {
            var rowData = headers.map(function(col) {
                var val = rowObj[col];
                return val === null || val === undefined ? '' : String(val);
            });
            rows.push(rowData.join('\t'));
        });

        var tsv = rows.join('\n');
        navigator.clipboard.writeText(tsv).then(function () {
            showCopyFeedback('Copied ' + currentData.length + ' rows!');
        }).catch(function () {
            var $ta = $('<textarea>').val(tsv).appendTo('body').select();
            document.execCommand('copy'); $ta.remove();
            showCopyFeedback('Copied ' + currentData.length + ' rows!');
        });
    });

    function showCopyFeedback(msg) {
        var $fb = $('#copyFeedback');
        $fb.text(msg).addClass('show');
        setTimeout(function () { $fb.removeClass('show'); }, 2500);
    }
});
</script>
</body>
</html>
