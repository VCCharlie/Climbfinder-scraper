<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climbfinder Ranking Aggregator</title>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

    <style>
        /* === Reset & Base === */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc; /* slate-50 */
            color: #1e293b; /* slate-800 */
            line-height: 1.5;
        }

        /* === Layout === */
        .container { max-width: 80rem; margin: 0 auto; padding: 2rem 1rem; }
        .hidden { display: none !important; }

        /* === Flexbox / Grid helpers === */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-end { align-items: flex-end; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-6 { gap: 1.5rem; }
        .w-full { width: 100%; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            align-items: end;
        }
        @media (min-width: 768px) {
            .form-grid { grid-template-columns: 2fr 1fr 1fr; }
        }

        /* === Spacing === */
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-2 { margin-top: 0.5rem; }
        .ml-2 { margin-left: 0.5rem; }

        /* === Typography === */
        .text-sm { font-size: 0.875rem; }
        .text-xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .font-normal { font-weight: 400; }
        .text-left { text-align: left; }

        /* === Colors === */
        .text-blue-600 { color: #2563eb; }
        .text-green-600 { color: #16a34a; }
        .text-orange-500 { color: #f97316; }
        .text-red-600 { color: #dc2626; }
        .text-slate-400 { color: #94a3b8; }
        .text-slate-500 { color: #64748b; }
        .text-slate-700 { color: #334155; }
        .text-white { color: #fff; }
        .bg-white { background-color: #fff; }

        /* === Cards === */
        .card {
            background: #fff;
            padding: 1.5rem;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.05);
        }

        /* === Form elements === */
        label { display: block; font-size: 0.875rem; font-weight: 500; color: #334155; margin-bottom: 0.25rem; }
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            background: #fff;
            color: #1e293b;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.05);
        }
        select:focus, input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37,99,235,.25);
        }
        .custom-id-input { width: 6rem; text-align: center; }

        /* === Button === */
        .btn-primary {
            width: 100%;
            background-color: #2563eb;
            color: #fff;
            font-weight: 700;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.15s;
        }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        /* === Results header === */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .results-header h2 { font-size: 1.25rem; font-weight: 600; }
        .results-header .count { font-size: 0.875rem; font-weight: 400; color: #64748b; margin-left: 0.5rem; }

        /* === Table wrapper === */
        .table-wrap { overflow-x: auto; }

        /* === Loading Spinner === */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* === DataTables overrides === */
        .dataTables_wrapper .dataTables_length select {
            padding-right: 2rem;
            border-radius: 0.25rem;
            border: 1px solid #e2e8f0;
        }
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #e2e8f0;
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            margin-left: 0.5rem;
        }
        table.dataTable tbody tr:hover { background-color: #f1f5f9; }

        /* === Inline render styles (used by DataTable cell renderers) === */
        .climb-name { font-weight: 500; color: #2563eb; }
        .grad-low { color: #16a34a; }
        .grad-mid { color: #f97316; }
        .grad-high { color: #dc2626; font-weight: 700; }

        /* === Export buttons === */
        .dt-buttons .dt-button {
            color: #fff !important;
            padding: 0.5rem 1rem !important;
            border-radius: 0.375rem !important;
            border: none !important;
            margin-bottom: 1rem !important;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .dt-buttons .buttons-excel { background-color: #16a34a !important; }
        .dt-buttons .buttons-excel:hover { background-color: #15803d !important; }
        .dt-buttons .buttons-csv { background-color: #475569 !important; margin-left: 0.5rem !important; }
        .dt-buttons .buttons-csv:hover { background-color: #334155 !important; }

        /* === SVG icon === */
        .icon { width: 2rem; height: 2rem; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="container">

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-blue-600 flex items-center gap-2">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                Climbfinder Aggregator
            </h1>
            <p class="text-slate-500 mt-2">Scrape rankings, analyze gradients, and export to Excel.</p>
        </div>

        <div class="card mb-8">
            <form id="scrapeForm" class="form-grid">

                <div>
                    <label>Region Discovery</label>
                    <div class="flex gap-2">
                        <select id="regionSelect">
                            <option value="" disabled selected>Select a popular region...</option>
                            {% for name, id in regions.items() %}
                                <option value="{{ id }}">{{ name }} (ID: {{ id }})</option>
                            {% endfor %}
                            <option value="custom">-- Enter Custom ID --</option>
                        </select>
                        <input type="text" id="customRegionId" placeholder="ID" class="hidden custom-id-input" />
                    </div>
                </div>

                <div>
                    <label>Page Range</label>
                    <div class="flex items-center gap-2">
                        <input type="number" id="startPage" value="1" min="1" placeholder="Start">
                        <span class="text-slate-400">to</span>
                        <input type="number" id="endPage" value="3" min="1" placeholder="End">
                    </div>
                </div>

                <div>
                    <button type="submit" id="scrapeBtn" class="btn-primary">
                        <span>Fetch Data</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="card hidden" id="resultsContainer">
            <div class="results-header">
                <h2>Results <span id="resultCount" class="count"></span></h2>
            </div>

            <div class="table-wrap">
                <table id="climbsTable" class="display w-full text-sm text-left">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Climb Name</th>
                            <th>Difficulty</th>
                            <th>Length (km)</th>
                            <th>Elev. Gain (m)</th>
                            <th>Avg Gradient (%)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

    <script>
        $(document).ready(function() {
            let table = null;

            // Handle Region Dropdown logic
            $('#regionSelect').on('change', function() {
                if ($(this).val() === 'custom') {
                    $('#customRegionId').removeClass('hidden').focus();
                } else {
                    $('#customRegionId').addClass('hidden');
                }
            });

            $('#scrapeForm').on('submit', function(e) {
                e.preventDefault();

                // Determine Region ID
                let regionId = $('#regionSelect').val();
                if (regionId === 'custom') {
                    regionId = $('#customRegionId').val();
                }

                if (!regionId) {
                    alert("Please select or enter a Region ID.");
                    return;
                }

                const startPage = $('#startPage').val();
                const endPage = $('#endPage').val();
                const btn = $('#scrapeBtn');

                // UI Loading State
                btn.prop('disabled', true).html('<div class="loader"></div> Processing...');
                $('#resultsContainer').addClass('hidden');

                // AJAX Request
                $.ajax({
                    url: '/scrape',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        region_id: regionId,
                        start_page: startPage,
                        end_page: endPage
                    }),
                    success: function(response) {
                        renderTable(response.data);
                        $('#resultCount').text('(' + response.count + ' climbs found)');
                        $('#resultsContainer').removeClass('hidden');
                    },
                    error: function(err) {
                        alert('Error fetching data. Check console for details.');
                        console.error(err);
                    },
                    complete: function() {
                        btn.prop('disabled', false).html('<span>Fetch Data</span>');
                    }
                });
            });

            function renderTable(data) {
                if (table) {
                    table.destroy();
                }

                table = $('#climbsTable').DataTable({
                    data: data,
                    columns: [
                        { data: 'rank' },
                        { data: 'name', render: function(data, type, row) {
                            return '<span class="climb-name">' + data + '</span>';
                        }},
                        { data: 'difficulty_points' },
                        { data: 'length_km' },
                        { data: 'elevation_gain_m' },
                        { data: 'avg_gradient_pct', render: function(data) {
                            let cls = 'grad-low';
                            if (data > 8) cls = 'grad-high';
                            else if (data > 5) cls = 'grad-mid';
                            return '<span class="' + cls + '">' + data + '%</span>';
                        }}
                    ],
                    dom: 'Bfrtip',
                    buttons: [
                        {
                            extend: 'excelHtml5',
                            text: 'Export to Excel',
                            title: 'Climbfinder_Export',
                            autoFilter: true
                        },
                        {
                            extend: 'csvHtml5',
                            text: 'Export CSV'
                        }
                    ],
                    pageLength: 25,
                    order: [[0, 'asc']]
                });
            }
        });
    </script>
</body>
</html>
