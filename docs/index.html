<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universele FietsKlim Scraper</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script> 
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>

    <style>
        .dt-button {
            background-color: #0f766e !important; /* Tailwind Teal-700 */
            color: white !important;
            border: none !important;
            border-radius: 0.375rem !important;
            padding: 0.5rem 1rem !important;
            margin-right: 0.5rem !important;
        }
        .dt-button:hover { background-color: #0d9488 !important; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff; border-radius: 50%; width: 1rem; height: 1rem; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 0.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-teal-700 mb-2">FietsKlim HTML Scraper</h1>
            <p class="text-slate-500">Haal data van sites met HTML-tabellen (zoals cyclingup.eu of heuvelsfietsen.nl) direct in je browser.</p>
        </header>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <label class="block text-sm font-semibold text-slate-700 mb-2">URL van de ranglijst:</label>
            <div class="flex gap-4">
                <input type="text" id="urlInput" value="https://cyclingup.eu/nederlands/zwaarte.php" 
                       class="flex-1 p-3 border border-slate-300 rounded focus:ring-2 focus:ring-teal-500 outline-none">
                <button onclick="fetchData()" id="scrapeBtn"
                        class="bg-teal-600 text-white px-6 py-3 rounded hover:bg-teal-700 font-bold transition shadow whitespace-nowrap">
                    Haal Data Op
                </button>
            </div>
            
            <div class="mt-4 flex items-center gap-2">
                <input type="checkbox" id="nlFormat" checked class="w-4 h-4 text-teal-600">
                <label for="nlFormat" class="text-sm text-slate-600">Converteer NL notatie (bijv. 8,5 naar 8.5 voor Excel)</label>
            </div>
            
            <p id="statusMsg" class="mt-4 text-sm font-semibold hidden"></p>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md hidden" id="resultsContainer">
            <h2 class="text-xl font-bold mb-4">Resultaten <span id="resultCount" class="text-sm font-normal text-slate-500 ml-2"></span></h2>
            
            <div class="overflow-x-auto">
                <table id="resultsTable" class="w-full text-left border-collapse display stripe hover">
                    </table>
            </div>
        </div>
    </div>

    <script>
        let table;

        // CORS proxy om cross-origin restricties in de browser te omzeilen
        const CORS_PROXIES = [
            url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`
        ];

        async function fetchData() {
            const url = document.getElementById('urlInput').value.trim();
            const isDutch = document.getElementById('nlFormat').checked;
            const btn = document.getElementById('scrapeBtn');
            const status = document.getElementById('statusMsg');
            const container = document.getElementById('resultsContainer');

            if (!url) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Bezig...';
            status.className = "mt-4 text-sm font-semibold text-blue-600 block";
            status.innerText = "Pagina ophalen via proxy...";
            container.classList.add('hidden');

            let htmlContent = null;
            let success = false;

            // Probeer proxies opeenvolgend
            for (let i = 0; i < CORS_PROXIES.length; i++) {
                try {
                    const proxyUrl = CORS_PROXIES[i](url);
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error('Proxy response niet ok');
                    
                    const data = await response.json();
                    htmlContent = data.contents; // allorigins structuur
                    if (!htmlContent && typeof data === 'string') htmlContent = data; // als het direct text is
                    if (!htmlContent) htmlContent = await response.text(); // fallback

                    if (htmlContent && htmlContent.includes('<table')) {
                        success = true;
                        break;
                    }
                } catch (e) {
                    console.log(`Proxy ${i + 1} faalde:`, e);
                }
            }

            if (!success || !htmlContent) {
                status.className = "mt-4 text-sm font-semibold text-red-600 block";
                status.innerText = "❌ Fout: Kon pagina niet ophalen of er staan geen HTML tabellen op deze pagina.";
                btn.disabled = false;
                btn.innerText = "Haal Data Op";
                return;
            }

            status.innerText = "Tabel verwerken...";
            
            try {
                // Parse HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                const tables = Array.from(doc.querySelectorAll('table'));
                
                if (tables.length === 0) {
                    throw new Error("Geen <table> elementen gevonden.");
                }

                // Pak de grootste tabel (meeste rijen)
                const targetTable = tables.reduce((prev, current) => 
                    (prev.querySelectorAll('tr').length > current.querySelectorAll('tr').length) ? prev : current
                );

                const rows = Array.from(targetTable.querySelectorAll('tr'));
                if (rows.length < 2) throw new Error("Tabel heeft niet genoeg rijen.");

                // Zoek headers (probeer <th>, anders eerste <tr>)
                let headers = [];
                let startIndex = 1;
                const ths = targetTable.querySelectorAll('th');
                
                if (ths.length > 0) {
                    headers = Array.from(ths).map(th => th.textContent.trim());
                    // Soms staan th's in de rows, we slaan rijen over die alleen th's bevatten
                    startIndex = rows.findIndex(row => row.querySelector('td'));
                    if (startIndex === -1) startIndex = 1;
                } else {
                    // Gebruik rij 1 als header
                    headers = Array.from(rows[0].querySelectorAll('td')).map(td => td.textContent.trim());
                }

                // Genereer fallback namen voor lege headers
                headers = headers.map((h, i) => h || `Kolom ${i + 1}`);

                const tableData = [];
                for (let i = startIndex; i < rows.length; i++) {
                    const cells = Array.from(rows[i].querySelectorAll('td'));
                    if (cells.length === 0) continue; // Sla lege rijen over
                    
                    let rowData = {};
                    let hasData = false;

                    cells.forEach((cell, index) => {
                        if (index < headers.length) {
                            let val = cell.textContent.trim();
                            // Als NL notatie aan staat, verander komma's naar punten voor getallen (behalve data/tekst)
                            if (isDutch && /^[\d\s]+,\d+\s*(%|km|m|pt)?$/i.test(val)) {
                                val = val.replace(',', '.');
                            }
                            rowData[headers[index]] = val;
                            if (val) hasData = true;
                        }
                    });

                    if (hasData) tableData.push(rowData);
                }

                status.className = "mt-4 text-sm font-semibold text-green-600 block";
                status.innerText = `✅ Succes! ${tableData.length} rijen gevonden.`;
                
                renderTable(headers, tableData);
                document.getElementById('resultCount').innerText = `(${tableData.length} rijen)`;
                container.classList.remove('hidden');

            } catch (error) {
                status.className = "mt-4 text-sm font-semibold text-red-600 block";
                status.innerText = `❌ Fout bij verwerken tabel: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Haal Data Op";
            }
        }

        function renderTable(columns, data) {
            if (table) {
                table.destroy();
                $('#resultsTable').empty();
            }

            const tableHeaders = columns.map(col => ({ title: col, data: col }));

            table = $('#resultsTable').DataTable({
                data: data,
                columns: tableHeaders,
                dom: 'Bfrtip',
                buttons: [
                    { extend: 'excelHtml5', text: '📥 Export naar Excel', className: 'dt-button' },
                    { extend: 'csvHtml5', text: '📄 Export naar CSV', className: 'dt-button' }
                ],
                pageLength: 25,
                language: {
                    search: "Zoeken:",
                    lengthMenu: "Toon _MENU_ rijen",
                    info: "Toont _START_ tot _END_ van _TOTAL_ beklimmingen",
                    paginate: { first: "Eerste", last: "Laatste", next: "Volgende", previous: "Vorige" }
                }
            });
        }
    </script>
</body>
</html>
