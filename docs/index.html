<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universele FietsKlim Scraper</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Barlow', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script> 
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>

    <style>
        .dt-button {
            background-color: #0f766e !important; /* Tailwind Teal-700 */
            color: white !important;
            border: none !important;
            border-radius: 0.375rem !important;
            padding: 0.5rem 1rem !important;
            margin-right: 0.5rem !important;
            font-family: 'Barlow', sans-serif !important;
        }
        .dt-button:hover { background-color: #0d9488 !important; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff; border-radius: 50%; width: 1rem; height: 1rem; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 0.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        table.dataTable, table.dataTable th, table.dataTable td {
            font-family: 'Barlow', sans-serif !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-teal-700 mb-2">FietsKlim HTML Scraper</h1>
            <p class="text-slate-500">Haal direct tabellen van sites zoals cyclingup.eu en heuvelsfietsen.nl</p>
        </header>

        <div class="bg-white p-4 md:p-6 rounded-lg shadow-md mb-8">
            
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2" for="regionSelect">Snelkeuze Regio:</label>
                <select id="regionSelect" onchange="updateUrlFromSelect()" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-teal-500 outline-none bg-slate-50 cursor-pointer">
                    <option value="">-- Typ zelf een URL (hieronder) of kies een regio --</option>
                    <option value="https://cyclingup.eu/nederlands/zwaarte.php">🌍 Algemeen (Europa - Zwaarte Ranglijst)</option>
                    <option value="https://cyclingup.eu/nederlands/France_Alps.php">🇫🇷 Franse Alpen</option>
                    <option value="https://cyclingup.eu/nederlands/Switzerland.php">🇨🇭 Zwitserland</option>
                    <option value="https://cyclingup.eu/nederlands/Austria.php">🇦🇹 Oostenrijk</option>
                    <option value="https://cyclingup.eu/nederlands/Italy_Alps.php">🇮🇹 Italiaanse Alpen</option>
                    <option value="https://cyclingup.eu/nederlands/France_Pyrenees.php">🇫🇷 Franse Pyreneeën</option>
                    <option value="https://cyclingup.eu/nederlands/Spain.php">🇪🇸 Spanje</option>
                    <option value="https://cyclingup.eu/nederlands/Gran_Canaria.php">🇮🇨 Gran Canaria</option>
                    <option value="https://cyclingup.eu/nederlands/Vosges.php">🇫🇷 Vogezen</option>
                    <option value="https://cyclingup.eu/nederlands/Black_Forest.php">🇩🇪 Zwarte Woud</option>
                    <option value="https://cyclingup.eu/nederlands/Brocken.php">🇩🇪 Brocken, Duitsland</option>
                    <option value="https://cyclingup.eu/nederlands/Ardennes.php">🇧🇪 Ardennen</option>
                    <option value="https://heuvelsfietsen.nl/Zuid-Limburg.php">🇳🇱 Nederland (Zuid-Limburg)</option>
                </select>
            </div>

            <label class="block text-sm font-semibold text-slate-700 mb-2">Webpagina URL:</label>
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="urlInput" value="https://cyclingup.eu/nederlands/zwaarte.php" 
                       class="flex-1 p-3 border border-slate-300 rounded focus:ring-2 focus:ring-teal-500 outline-none">
                <button onclick="fetchData()" id="scrapeBtn"
                        class="bg-teal-600 text-white px-6 py-3 rounded hover:bg-teal-700 font-bold transition shadow whitespace-nowrap">
                    Haal Data Op
                </button>
            </div>
            
            <div class="mt-4 flex items-center gap-2">
                <input type="checkbox" id="nlFormat" checked class="w-5 h-5 text-teal-600 cursor-pointer">
                <label for="nlFormat" class="text-sm text-slate-600 cursor-pointer">Converteer NL getalnotatie (bijv. 8,5 naar 8.5 voor Excel rekensommen)</label>
            </div>
            
            <p id="statusMsg" class="mt-4 text-sm font-semibold hidden"></p>
        </div>

        <div class="bg-white p-4 md:p-6 rounded-lg shadow-md hidden" id="resultsContainer">
            <h2 class="text-xl font-bold mb-4">Resultaten <span id="resultCount" class="text-sm font-normal text-slate-500 ml-2"></span></h2>
            
            <div class="overflow-x-auto">
                <table id="resultsTable" class="w-full text-left border-collapse display stripe hover">
                    </table>
            </div>
        </div>
    </div>

    <script>
        let table;

        function updateUrlFromSelect() {
            const selectBox = document.getElementById('regionSelect');
            const urlInput = document.getElementById('urlInput');
            if (selectBox.value !== "") {
                urlInput.value = selectBox.value;
            }
        }

        // Gebruik /raw in plaats van de JSON wrapper voor betrouwbaardere HTML
        const CORS_PROXIES = [
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`
        ];

        async function fetchData() {
            const url = document.getElementById('urlInput').value.trim();
            const isDutch = document.getElementById('nlFormat').checked;
            const btn = document.getElementById('scrapeBtn');
            const status = document.getElementById('statusMsg');
            const container = document.getElementById('resultsContainer');

            if (!url) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Bezig...';
            status.className = "mt-4 text-sm font-semibold text-blue-600 block";
            status.innerText = "Pagina ophalen...";
            container.classList.add('hidden');

            let htmlContent = null;
            let success = false;
            let finalDoc = null;

            // Probeer proxies opeenvolgend
            for (let i = 0; i < CORS_PROXIES.length; i++) {
                try {
                    const proxyUrl = CORS_PROXIES[i](url);
                    const response = await fetch(proxyUrl);
                    if (!response.ok) continue;
                    
                    htmlContent = await response.text(); 
                    
                    // Parse direct met DOMParser (negeert hoofdletters/kleine letters in tags)
                    const parser = new DOMParser();
                    finalDoc = parser.parseFromString(htmlContent, 'text/html');
                    
                    if (finalDoc.querySelectorAll('table').length > 0) {
                        success = true;
                        break;
                    }
                } catch (e) {
                    console.log(`Proxy ${i + 1} faalde:`, e);
                }
            }

            if (!success || !finalDoc) {
                status.className = "mt-4 text-sm font-semibold text-red-600 block";
                status.innerText = "❌ Fout: Kon pagina niet ophalen of er staan geen HTML tabellen op deze pagina.";
                btn.disabled = false;
                btn.innerText = "Haal Data Op";
                return;
            }

            status.innerText = "Tabel verwerken...";
            
            try {
                const tables = Array.from(finalDoc.querySelectorAll('table'));
                
                // Pak de grootste tabel (meeste rijen) -> dit is vrijwel altijd de hoofdranglijst
                const targetTable = tables.reduce((prev, current) => 
                    (prev.querySelectorAll('tr').length > current.querySelectorAll('tr').length) ? prev : current
                );

                const rows = Array.from(targetTable.querySelectorAll('tr'));
                if (rows.length < 2) throw new Error("Tabel heeft niet genoeg rijen.");

                let headers = [];
                let startIndex = 1;
                const ths = targetTable.querySelectorAll('th');
                
                if (ths.length > 0) {
                    // Pak textContent (en zet <br> om in spaties indien nodig)
                    headers = Array.from(ths).map(th => th.textContent.replace(/\n/g, ' ').trim());
                    startIndex = rows.findIndex(row => row.querySelector('td'));
                    if (startIndex === -1) startIndex = 1;
                } else {
                    headers = Array.from(rows[0].querySelectorAll('td')).map(td => td.textContent.trim());
                }

                // Genereer fallback namen voor lege headers en voorkom duplicaten
                headers = headers.map((h, i) => h || `Kolom ${i + 1}`);

                const tableData = [];
                for (let i = startIndex; i < rows.length; i++) {
                    const cells = Array.from(rows[i].querySelectorAll('td'));
                    if (cells.length === 0) continue; 
                    
                    let rowData = {};
                    let hasData = false;

                    cells.forEach((cell, index) => {
                        if (index < headers.length) {
                            let val = cell.textContent.replace(/\n/g, ' ').trim();
                            
                            // Als NL notatie aan staat, verander komma's naar punten voor getallen
                            if (isDutch && /^[\d\s]+,\d+\s*(%|km|m|pt)?$/i.test(val)) {
                                val = val.replace(',', '.');
                            }
                            
                            rowData[headers[index]] = val;
                            if (val) hasData = true;
                        }
                    });

                    if (hasData) tableData.push(rowData);
                }

                status.className = "mt-4 text-sm font-semibold text-green-600 block";
                status.innerText = `✅ Succes! ${tableData.length} rijen gevonden.`;
                
                renderTable(headers, tableData);
                document.getElementById('resultCount').innerText = `(${tableData.length} rijen)`;
                container.classList.remove('hidden');

            } catch (error) {
                status.className = "mt-4 text-sm font-semibold text-red-600 block";
                status.innerText = `❌ Fout bij verwerken tabel: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Haal Data Op";
            }
        }

        function renderTable(columns, data) {
            if (table) {
                table.destroy();
                $('#resultsTable').empty();
            }

            // Wees er zeker van dat kolomnamen uniek zijn, anders crasht DataTables
            const uniqueCols = [];
            const tableHeaders = columns.map(col => {
                let safeCol = col;
                let counter = 1;
                while(uniqueCols.includes(safeCol)) {
                    safeCol = `${col} (${counter})`;
                    counter++;
                }
                uniqueCols.push(safeCol);
                return { title: safeCol, data: col };
            });

            table = $('#resultsTable').DataTable({
                data: data,
                columns: tableHeaders,
                dom: 'Bfrtip',
                buttons: [
                    { extend: 'excelHtml5', text: '📥 Export naar Excel', className: 'dt-button' },
                    { extend: 'csvHtml5', text: '📄 Export naar CSV', className: 'dt-button' }
                ],
                pageLength: 25,
                language: {
                    search: "Zoeken:",
                    lengthMenu: "Toon _MENU_ rijen",
                    info: "Toont _START_ tot _END_ van _TOTAL_ beklimmingen",
                    paginate: { first: "Eerste", last: "Laatste", next: "Volgende", previous: "Vorige" }
                }
            });
        }
    </script>
</body>
</html>
