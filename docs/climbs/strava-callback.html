<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strava koppelen — FietsKlim</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../auth/gate.css" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Barlow, system-ui, sans-serif; margin: 0; padding: 2rem 1.25rem; background: #f8fafc; color: #0f172a; }
    .card { max-width: 28rem; margin: 2rem auto; padding: 1.25rem; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .err { color: #b91c1c; }
  </style>
</head>
<body class="fietsklim-locked">
  <div id="fietsklim-auth-gate">
    <div class="fietsklim-auth-card">
      <h1>FietsKlim — Strava</h1>
      <p>Log in om de Strava-koppeling af te ronden.</p>
      <button type="button" id="fietsklim-google-btn" class="fietsklim-auth-btn">Inloggen met Google</button>
      <div id="fietsklim-auth-error" class="fietsklim-auth-error" role="alert"></div>
    </div>
  </div>

  <div id="fietsklim-app-root" class="card">
    <p id="status" role="status">Strava-koppeling afronden…</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-functions-compat.js"></script>
  <script src="../auth/firebase-config.js?v=20261011cartovoyager2"></script>
  <script src="../auth/gate.js"></script>
  <script>
    (function () {
      function cfg() {
        return window.FIETSKLIM_AUTH_CONFIG || {};
      }
      function fnRegion() {
        return cfg().strava?.region || cfg().githubImport?.region || "europe-west1";
      }
      function setStatus(msg, isError) {
        const el = document.getElementById("status");
        if (el) {
          el.textContent = msg;
          el.classList.toggle("err", Boolean(isError));
        }
      }
      function settingsUrl() {
        const u = cfg().strava?.settingsUrl;
        if (u) return u;
        return new URL("settings.html", window.location.href).href;
      }
      function redirectWithParam(base, key, val) {
        const url = new URL(base, window.location.href);
        url.searchParams.set(key, val);
        window.location.replace(url.pathname + url.search + url.hash);
      }
      async function finishOAuth() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("error")) {
          redirectWithParam(settingsUrl(), "strava", "denied");
          return;
        }
        const code = params.get("code");
        const state = params.get("state");
        if (!code || !state) {
          setStatus("Geen Strava-code in URL. Ga naar Instellingen en klik opnieuw op Koppel Strava.", true);
          return;
        }
        if (!firebase.auth().currentUser) {
          setStatus("Niet ingelogd — log in en open deze pagina opnieuw vanaf Strava, of start Koppel Strava opnieuw.", true);
          return;
        }
        setStatus("Tokens veilig opslaan…");
        try {
          const fn = firebase.app().functions(fnRegion()).httpsCallable("stravaCompleteOAuth");
          const res = await fn({ code, state });
          const returnUrl = res.data?.returnUrl || settingsUrl();
          redirectWithParam(returnUrl, "strava", "connected");
        } catch (e) {
          const msg = e.message || String(e);
          setStatus(msg, true);
          if (/redirect_uri|token/i.test(msg)) {
            setStatus(msg + " — controleer strava.redirect_uri in Functions (GitHub Pages URL).", true);
          }
        }
      }
      window.addEventListener("fietsklim-authenticated", function () {
        void finishOAuth();
      });
      if (window.__FIETSKLIM_AUTH_READY) {
        void finishOAuth();
      }
    })();
  </script>
</body>
</html>
