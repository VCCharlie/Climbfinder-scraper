<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FietsKlim Database — kaart &amp; profiel</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../auth/gate.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="fietsklim-locked">
  <div id="fietsklim-auth-gate">
    <div class="fietsklim-auth-card">
      <h1>FietsKlim — persoonlijk</h1>
      <p>Deze site is alleen voor privégebruik. Log in met het toegestane Google-account.</p>
      <button type="button" id="fietsklim-google-btn" class="fietsklim-auth-btn">Inloggen met Google</button>
      <div id="fietsklim-auth-error" class="fietsklim-auth-error" role="alert"></div>
      <p class="fietsklim-auth-note">Toegestaan: vr.deruiter@gmail.com</p>
    </div>
  </div>
  <div id="fietsklim-app-root" class="layout">
    <header class="app-header">
      <div>
        <h1>FietsKlim Database</h1>
        <p id="datasetMeta">Laden…</p>
      </div>
      <div>
        <span id="fietsklim-auth-userbar" class="fietsklim-auth-userbar"></span>
        <a href="import.html" style="font-size:0.85rem;color:#0f766e;">Climbfinder import</a>
        <a href="../index.html" style="font-size:0.85rem;color:#0f766e;">← HTML Scraper</a>
      </div>
    </header>

    <aside class="sidebar">
      <div class="sidebar-tools">
        <div class="field">
          <label for="searchInput">Zoeken (alle regio’s)</label>
          <input id="searchInput" type="search" placeholder="Naam, slug, regio, tag…" autocomplete="off" />
          <p id="searchHint" class="field-hint">Leeg = overzichtskaart met alle klimmen. Typ om te filteren.</p>
        </div>
        <div class="field">
          <label for="regionSelect">Regio-dataset (JSON)</label>
          <select id="regionSelect"></select>
        </div>
      </div>

      <div id="climbDetailPanel" class="climb-detail-panel" hidden>
        <button type="button" id="profileExpandOpen" class="climb-detail-name" title="Profiel vergroten (Climbfinder-stijl)">
          <span id="profileTitle">Klim</span>
          <span class="climb-detail-chevron" aria-hidden="true">↗</span>
        </button>
        <p id="profileStats" class="climb-detail-stats"></p>
        <div id="profileGradientStripMini" class="profile-gradient-strip profile-gradient-strip--mini" aria-hidden="true"></div>
        <div class="profile-chart-wrap profile-chart-wrap--mini">
          <canvas id="profileChartMini"></canvas>
        </div>
        <button type="button" id="profileExpandLink" class="link-expand">Profiel vergroten</button>
      </div>

      <div id="climbList" class="climb-list"></div>
    </aside>

    <main class="map-panel">
      <button type="button" id="mapBackOverview" class="map-back-overview" hidden title="Heel regio-overzicht (uitzoomen)">
        ← Overzichtskaart
      </button>
      <div id="map"></div>
    </main>
  </div>

  <div id="profileExpandOverlay" class="profile-expand-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="profileTitleFull">
    <div class="profile-expand-backdrop" id="profileExpandBackdrop"></div>
    <div class="profile-expand-card">
      <button type="button" id="profileExpandClose" class="profile-expand-close" aria-label="Sluiten">×</button>
      <h2 id="profileTitleFull" class="profile-expand-title"></h2>
      <p id="profileStatsFull" class="profile-expand-stats"></p>
      <div id="profileGradientStripFull" class="profile-gradient-strip" aria-label="Gemiddelde helling per segment"></div>
      <div class="profile-chart-wrap profile-chart-wrap--full">
        <canvas id="profileChartFull"></canvas>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="../auth/firebase-config.js"></script>
  <script src="../auth/gate.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="assets/climb-metrics.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
